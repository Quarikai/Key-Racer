<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клавогонщик - Тренажер печати</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⌨️ Клавогонщик</h1>
            <div class="stats-header">
                <div class="stat-item">
                    <span class="stat-label">Скорость:</span>
                    <span id="speed" class="stat-value">0</span>
                    <span class="stat-unit">зн/мин</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Точность:</span>
                    <span id="accuracy" class="stat-value">100</span>
                    <span class="stat-unit">%</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Время:</span>
                    <span id="timer" class="stat-value">00:00</span>
                </div>
            </div>
        </header>

        <main>
            <div class="settings">
                <select id="language">
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
                <select id="difficulty">
                    <option value="easy">Легкий</option>
                    <option value="medium" selected>Средний</option>
                    <option value="hard">Сложный</option>
                </select>
                <button id="startBtn" class="btn-primary">Начать тренировку</button>
                <button id="resetBtn" class="btn-secondary">Сброс</button>
                <!-- Кнопка обучения будет добавлена через JavaScript -->
            </div>

            <div class="text-display">
                <div id="textToType" class="text-to-type"></div>
                <input type="text" id="userInput" class="user-input" placeholder="Начните печатать..." autofocus>
            </div>

            <div class="keyboard-container">
                <div id="keyboard" class="keyboard"></div>
            </div>

            <div class="statistics">
                <h3>📊 Статистика</h3>
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-card-label">Правильных символов</span>
                        <span id="correctChars" class="stat-card-value">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-card-label">Ошибок</span>
                        <span id="errors" class="stat-card-value">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-card-label">Всего символов</span>
                        <span id="totalChars" class="stat-card-value">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-card-label">Лучшая скорость</span>
                        <span id="bestSpeed" class="stat-card-value">0</span>
                        <span class="stat-unit">зн/мин</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Подключаем все скрипты -->
    <script src="js/config.js"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/trainer.js"></script>
    <script src="js/statistics.js"></script>
    <script src="js/tutorial.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
